<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:100%;display:flex;flex-direction:column;gap:14px;background:#FFFFFF;border:1px solid #E6E9F2;border-radius:20px;padding:28px;box-shadow:0 4px 24px rgba(11,21,51,.06);font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#0B1533;line-height:1.65">
  <span style="color:#16A34A;letter-spacing:2px;font-size:13px">★★★★★</span>
  <p style="margin:0;font-size:16.5px;flex:1 1 auto;text-wrap:pretty">{{ quote }}</p>
  <div style="display:flex;align-items:center;gap:12px">
    <span style="width:38px;height:38px;border-radius:50%;background:#E7ECFF"></span>
    <span style="display:flex;flex-direction:column;line-height:1.35"><strong style="font-size:15px;font-weight:700">{{ author }}</strong><span style="font-size:13px;color:#8A93AD">{{ meta }}</span></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:220},&quot;quote&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Antes abría operaciones por intuición. Ahora tengo un orden de análisis y sé cuándo quedarme fuera.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;author&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Javier M.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;meta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Valencia · 8 meses operando&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
